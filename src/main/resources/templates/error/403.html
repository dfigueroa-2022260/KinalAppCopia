<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso Denegado - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">KinalApp</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                    <span sec:authorize="hasRole('USER')" class="badge bg-primary ms-1">USER</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                            </button>
                        </form>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">

            <div class="card shadow border-0">
                <div class="card-body py-5 px-4">

                    <div class="mb-4">
                        <i class="bi bi-shield-lock-fill text-danger" style="font-size: 5rem;"></i>
                    </div>

                    <h2 class="fw-bold text-danger mb-2">Acceso Denegado</h2>

                    <p class="text-muted fs-5 mb-1">
                        Esta sección es exclusiva para <strong>Administradores</strong>.
                    </p>
                    <p class="text-muted mb-4">
                        Tu cuenta no tiene los permisos necesarios para ver este contenido.
                    </p>

                    <div class="alert alert-warning d-inline-flex align-items-center gap-2 px-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>Solo usuarios con rol <strong>ADMIN</strong> pueden acceder aquí.</span>
                    </div>

                    <div class="mt-4">
                        <a th:href="@{/}" class="btn btn-dark me-2">
                            <i class="bi bi-house-door-fill"></i> Volver al Inicio
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
